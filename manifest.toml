#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "rmfakecloud"
name = "rmfakecloud"
description.en = "Host your own cloud for the remarkable"

version = "0.0.32~ynh1"

maintainers = ["Thovi98"]

[upstream]
license = "AGPL-3.0"
website = "https://ddvk.github.io/rmfakecloud/"
userdoc = "https://ddvk.github.io/rmfakecloud/remarkable/setup/"
code = "https://github.com/ddvk/rmfakecloud"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = false

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    amd64.url = "https://github.com/ddvk/rmfakecloud/releases/download/v0.0.32/rmfakecloud-x64"
    amd64.sha256 = "7513e429411256ffb13e6eaf86d5a1fd2c2974ee2dc3077656ec79c48d086551"
    
    arm64.url = "https://github.com/ddvk/rmfakecloud/releases/download/v0.0.32/rmfakecloud-arm64"
    arm64.sha256 = "4a3812438e0a3938300de0c88148f99ed4df41176cbdce213d88ab7177ccf10f"

    armhf.url = "https://github.com/ddvk/rmfakecloud/releases/download/v0.0.32/rmfakecloud-armv7"
    armhf.sha256 = "363e1fa4ca9656d5deab360acdf32c18a12c33fbdb74e74c5228ed7475d6286f"
    
    in_subdir = false
    rename = "rmfakecloud"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "rmfakecloud-x64"
    autoupdate.asset.arm64 = "rmfakecloud-arm64"
    autoupdate.asset.armhf = "rmfakecloud-armv7"

    [resources.system_user]
    allow_email = true

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]



